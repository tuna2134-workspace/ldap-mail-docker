# Sign outbound mail submitted by authenticated users with the domain's DKIM
# key.  Keys are generated on first start by entrypoint.sh.
selector = "mail";
path = "/var/lib/rspamd/dkim/$domain.$selector.key";

# Only authenticated submission traffic is signed.  Inbound mail must never be
# signed with our key, and unauthenticated local injections are not mail we
# vouch for.
sign_authenticated = true;
sign_local = false;

# The From: domain must match the envelope/authenticated domain.
allow_hdrfrom_mismatch = false;
allow_username_mismatch = false;
use_domain = "header";
use_esld = true;
try_fallback = true;
