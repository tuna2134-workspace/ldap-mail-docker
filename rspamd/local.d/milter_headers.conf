# Add SpamAssassin-compatible headers to inbound mail.  Dovecot's sieve_before
# script moves messages with "X-Spam-Flag: YES" into Junk.
#
# skip_authenticated keeps these headers off outbound submission traffic.
# skip_local is disabled so that locally injected test mail is still scored
# and headered; set it back to true if you inject trusted mail from containers.
use = ["spam-header", "x-spam-status", "x-spam-level", "authentication-results"];
skip_authenticated = true;
skip_local = false;
extended_spam_headers = false;

routines {
    spam-header {
        header = "X-Spam-Flag";
        value = "YES";
        remove = 0;
    }
}
