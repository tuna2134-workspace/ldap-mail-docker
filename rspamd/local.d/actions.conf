# Score thresholds.  Rspamd's defaults are repeated here so they are visible
# and easy to tune.
#
#   < 4        clean (no action)
#   4 - 5.99   greylist (requires the Redis-backed module; otherwise no-op)
#   6 - 14.99  add headers; Dovecot Sieve files the message into Junk
#   >= 15      reject at SMTP time (milter)
greylist = 4;
add_header = 6;
reject = 15;
