# Single-file Dovecot 2.3 configuration for a virtual-mail only server.
# The Debian conf.d snippets are intentionally not included.

protocols = imap lmtp
listen = *, ::

base_dir = /run/dovecot/
state_dir = /var/lib/dovecot
log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stdout
syslog_facility = mail

# ---------------------------------------------------------------------------
# TLS / STARTTLS (certificate shared with Postfix and managed by certbot)
# ---------------------------------------------------------------------------
ssl = required
ssl_cert = </etc/ssl/mail/fullchain.pem
ssl_key = </etc/ssl/mail/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
ssl_options = no_compression

disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_username_format = %Lu

# ---------------------------------------------------------------------------
# Virtual users: one UID/GID for every mailbox, home from LDAP
# ---------------------------------------------------------------------------
# The LDAP userdb returns home=/data/maildir/<uid>, so every address in the
# user's mail attribute (and IMAP login with any of those addresses) uses the
# exact same Maildir.  mail_location "~/" makes the home itself the Maildir.
mail_location = maildir:~/
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
last_valid_uid = 5000
mailbox_list_index = yes

namespace inbox {
    inbox = yes

    mailbox Drafts {
        special_use = \Drafts
        auto = subscribe
    }
    mailbox Sent {
        special_use = \Sent
        auto = subscribe
    }
    mailbox Junk {
        special_use = \Junk
        auto = subscribe
    }
    mailbox Trash {
        special_use = \Trash
        auto = subscribe
    }
}

# ---------------------------------------------------------------------------
# Authentication / user lookup: OpenLDAP
# ---------------------------------------------------------------------------
passdb {
    driver = ldap
    args = /etc/dovecot/dovecot-ldap.conf.ext
}

userdb {
    driver = ldap
    args = /etc/dovecot/dovecot-ldap.conf.ext
}

# ---------------------------------------------------------------------------
# Services / sockets for Postfix
# ---------------------------------------------------------------------------
# Postfix runs without chroot and reaches both sockets through the shared
# /var/spool/postfix/private volume.  0666 is safe here: the sockets are only
# reachable inside the dedicated Docker volume.
service lmtp {
    unix_listener /var/spool/postfix/private/dovecot-lmtp {
        mode = 0666
    }
}

service auth {
    unix_listener /var/spool/postfix/private/auth {
        mode = 0666
    }
}

service imap-login {
    inet_listener imap {
        port = 143
    }
    inet_listener imaps {
        port = 993
        ssl = yes
    }
}

# ---------------------------------------------------------------------------
# Sieve: file Rspamd-flagged spam into Junk
# ---------------------------------------------------------------------------
protocol lmtp {
    mail_plugins = $mail_plugins sieve
}

plugin {
    sieve_before = /etc/dovecot/sieve/spam.sieve
    lda_mailbox_autocreate = yes
    lda_mailbox_autosubscribe = yes
}
